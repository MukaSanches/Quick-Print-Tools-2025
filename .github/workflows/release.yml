name: Build Installer and Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Test
        run: dotnet test tests/QuickPrintStudio.Core.Tests/QuickPrintStudio.Core.Tests.csproj -c Release
      - name: Build addon
        shell: pwsh
        run: |
          dotnet build src/QuickPrintStudio.Addon/QuickPrintStudio.Addon.csproj -c Release -p:Platform=x64
          [xml](Get-Content src/QuickPrintStudio.Addon/AppUI.xslt -Raw) | Out-Null
          [xml](Get-Content src/QuickPrintStudio.Addon/Views/DockerView.xaml -Raw) | Out-Null
          New-Item dist/addon -ItemType Directory -Force | Out-Null
          Copy-Item src/QuickPrintStudio.Addon/CorelDrw.addon dist/addon/
          Copy-Item src/QuickPrintStudio.Addon/AppUI.xslt dist/addon/
          Copy-Item src/QuickPrintStudio.Addon/bin/x64/Release/net48/QuickPrintStudio.dll dist/addon/
          Copy-Item src/QuickPrintStudio.Addon/bin/x64/Release/net48/QuickPrintStudio.Core.dll dist/addon/
          Copy-Item VERSION dist/addon/
      - name: Build installer
        shell: pwsh
        run: |
          Push-Location installer
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe",
              "C:\ProgramData\chocolatey\bin\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw "makensis.exe not found after NSIS installation" }
          Write-Host "Using NSIS: $makensis"
          & $makensis QuickPrintStudio.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          Pop-Location
          if (!(Test-Path installer/QuickPrintStudio-1.1.0-Setup.exe)) { throw "Installer was not generated" }
      - uses: actions/upload-artifact@v4
        with:
          name: QuickPrintStudio-1.1.0-Setup
          path: installer/QuickPrintStudio-1.1.0-Setup.exe
      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          files: installer/QuickPrintStudio-1.1.0-Setup.exe
          append_body: true
          body: |
            Windows installer: QuickPrintStudio-1.1.0-Setup.exe
            The user selects the CorelDRAW folder; setup validates CorelDRW.exe and installs the addon automatically. Corel proprietary DLLs are not redistributed.
