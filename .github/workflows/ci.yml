name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test independent production core
        run: dotnet test tests/QuickPrintStudio.Core.Tests/QuickPrintStudio.Core.Tests.csproj -c Release
      - name: Validate addon package sources
        shell: pwsh
        run: |
          if (!(Test-Path src/QuickPrintStudio.Addon/CorelDrw.addon)) { throw "CorelDrw.addon missing" }
          [xml](Get-Content src/QuickPrintStudio.Addon/AppUI.xslt -Raw) | Out-Null
          [xml](Get-Content src/QuickPrintStudio.Addon/Views/DockerView.xaml -Raw) | Out-Null
          if (!(Test-Path installer/QuickPrintStudio.nsi)) { throw "Installer source missing" }
          if ((Get-Content VERSION -Raw).Trim() -ne "1.2.0") { throw "VERSION must be 1.2.0" }
